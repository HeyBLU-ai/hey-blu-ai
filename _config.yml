# GitHub Pages Configuration
title: HeyBLU
description: AI-Powered Baseball Umpire Assistant

# Disable Jekyll processing for better static file serving
include: []
exclude: []

# Enable directory browsing and subdirectory serving
plugins:
  - jekyll-sitemap

# Ensure all directories are served
collections:
  pitchdeck:
    output: true
  rulebook:
    output: true
